; Pulse - firmware ESP32 (DevKit V1, ESP32-WROOM-32)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino

; 3MB de app (TLS + Wi-Fi não cabem folgados em 1.2MB) e ~1MB de LittleFS para os perfis
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1

; Firmware do Pulse
[env:esp32dev]
build_src_filter = +<*> -<hwtest/>
lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.2.0

; Teste da montagem: botões acendem o LED da placa e o display é procurado no I2C
[env:hwtest]
build_src_filter = +<hwtest/>
