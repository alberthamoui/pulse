target-version = "py310"
extend-exclude = ["pulse", "firmware"]

[lint]
# Explicit rules: a new ruff version doesn't change what CI enforces
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Both adjust sys.path before importing src/core and config
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
