target-version = "py310"
extend-exclude = ["pulse", "firmware"]

[lint]
# Regras explícitas: uma versão nova do ruff não muda o que o CI cobra
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Os dois ajustam o sys.path antes de importar src/core e config
"main.py" = ["E402"]
"tests/conftest.py" = ["E402"]
